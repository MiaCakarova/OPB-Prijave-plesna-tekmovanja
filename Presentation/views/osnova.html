<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>{{naslov}}</title>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">

        <a class="navbar-brand" href="{{url('/')}}">
            CompetiDance
        </a>

        <div class="navbar-nav">

            %if stran == 'domov':
                <a class="nav-link active" href="{{url('/')}}">Domov</a>
            %else:
                <a class="nav-link" href="{{url('/')}}">Domov</a>
            %end

            %if stran == 'plesalci':
                <a class="nav-link active" href="{{url('/plesalci')}}">Moji plesalci</a>
            %else:
                <a class="nav-link" href="{{url('/plesalci')}}">Moji plesalci</a>
            %end

            %if stran == 'tekmovanja':
                <a class="nav-link active" href="{{url('/tekmovanja')}}">Tekmovanja</a>
            %else:
                <a class="nav-link" href="{{url('/tekmovanja')}}">Tekmovanja</a>
            %end

            %if stran == 'prijave':
                <a class="nav-link active" href="{{url('/prijave')}}">Moje prijave</a>
            %else:
                <a class="nav-link" href="{{url('/prijave')}}">Moje prijave</a>
            %end

            <div class="dropdown ms-auto">
                <button class="btn btn-outline-secondary dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                    {{uporabnik}}
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" href="{{url('odjava')}}">
                        Odjava
                        </a>
                    </li>
                </ul>
            </div>
            
        </div>
    </div>
</nav>

<div class="container mt-4">
    {{!base}}
</div>

</body>
</html>
